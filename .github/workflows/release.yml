name: Release

# Every push and pull request builds the app and runs the tests. A push to main then publishes a GitHub release
# if the <Version> in src/MouseClicker/MouseClicker.csproj has no tag yet. Each release has a portable exe and a setup installer.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Test
        run: dotnet test tests/MouseClicker.Tests -c Release --nologo

  release:
    needs: test
    if: github.event_name == 'push'
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Read version and check for an existing release
        id: ver
        run: |
          $csproj = Get-Content src/MouseClicker/MouseClicker.csproj -Raw
          $v = [regex]::Match($csproj, '<Version>([^<]+)</Version>').Groups[1].Value
          if (-not $v) { throw 'No <Version> found' }
          "version=$v" >> $env:GITHUB_OUTPUT
          gh release view "v$v" *> $null
          $exists = $LASTEXITCODE -eq 0
          "release=$(if ($exists) { 'false' } else { 'true' })" >> $env:GITHUB_OUTPUT
          if ($exists) { "v$v already released; nothing to publish." }
          exit 0
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Publish portable exe
        if: steps.ver.outputs.release == 'true'
        # Self-contained single file, so it runs without a .NET install.
        run: >
          dotnet publish src/MouseClicker/MouseClicker.csproj -c Release -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=none
          -o publish/portable

      - name: Build setup installer
        if: steps.ver.outputs.release == 'true'
        run: |
          New-Item -ItemType Directory -Force stage | Out-Null
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          # The runner image may already have Inno Setup; install it only when it is missing.
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y }
          & $iscc "/DAppVersion=${{ steps.ver.outputs.version }}" "/DSourceDir=$PWD\publish\portable" "/O$PWD\stage" installer\MouseClicker.iss
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup failed' }

      - name: Package portable zip
        if: steps.ver.outputs.release == 'true'
        run: |
          $v = '${{ steps.ver.outputs.version }}'
          Compress-Archive publish/portable/MouseClicker.exe "stage/MouseClicker-$v-portable-x64.zip"

      - name: Publish release
        if: steps.ver.outputs.release == 'true'
        # Notes come from release-notes/v<version>.md when it exists, otherwise from the commit list.
        run: |
          $v = '${{ steps.ver.outputs.version }}'
          $notes = if (Test-Path "release-notes/v$v.md") { @('--notes-file', "release-notes/v$v.md") } else { @('--generate-notes') }
          gh release create "v$v" "stage/MouseClicker-Setup-$v.exe" "stage/MouseClicker-$v-portable-x64.zip" --target "${{ github.sha }}" --title "v$v" @notes
        env:
          GH_TOKEN: ${{ github.token }}
